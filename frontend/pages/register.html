<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KYBERS.OS — Ro'yxatdan o'tish. Premium kiberxavfsizlik platformasi." />
  <title>Ro'yxatdan o'tish — KYBERS.OS</title>
  <link rel="stylesheet" href="../css/fonts-auth.css" />
  <link rel="stylesheet" href="../css/auth.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><path d='M16 4 L28 9 L28 18 Q28 27 16 31 Q4 27 4 18 L4 9 Z' fill='none' stroke='%2300ff9f' stroke-width='1.5'/></svg>" />
</head>
<body>

  <div class="auth-container">
    <div class="auth-box">
      <!-- Header -->
      <div class="auth-header">
        <a href="../index.html" class="auth-logo">
          <img src="../images/logo.webp" alt="KYBERS.OS" onerror="this.style.display='none'" />
          <span>KYBERS.OS</span>
        </a>
        <h1 class="auth-title">Ro'yxatdan O'tish</h1>
        <p class="auth-subtitle">Yangi hisob yarating va boshlang</p>
        <p class="auth-date" id="currentDate"></p>
      </div>

      <!-- Register Form -->
      <form class="auth-form" id="registerForm" novalidate>

        <!-- Name -->
        <div class="form-group">
          <label class="form-label" for="name">Ism</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" class="form-input" id="name"
              placeholder="Ismingiz" autocomplete="name" required />
          </div>
          <span class="form-error" id="nameError"></span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" class="form-input" id="email"
              placeholder="email@example.com" autocomplete="email" required />
          </div>
          <span class="form-error" id="emailError"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Parol</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" class="form-input" id="password"
              placeholder="••••••••" autocomplete="new-password" required />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Parolni ko'rsatish">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="form-error" id="passwordError"></span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Parolni tasdiqlang</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" class="form-input" id="confirmPassword"
              placeholder="••••••••" autocomplete="new-password" required />
            <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Parolni ko'rsatish">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="form-error" id="confirmPasswordError"></span>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">Ro'yxatdan o'tish</span>
          <div class="btn-loader"></div>
        </button>
      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <p>Hisobingiz bormi? <a href="login.html">Kirish</a></p>
      </div>
    </div>

    <!-- Background effects -->
    <div class="auth-bg">
      <div class="cyber-grid"></div>
      <div class="glow-orb"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <div class="toast-icon"></div>
    <div class="toast-message"></div>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
